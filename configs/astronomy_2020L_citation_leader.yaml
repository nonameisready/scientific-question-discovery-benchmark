# Astronomy v1L (scaled instance) — citation_leader submission. Larger corpora from
# the v1L manifests, 125 questions per baseline, judge-only evaluation.
# The v1 instance and its released data remain frozen and unchanged.

benchmark_version: astronomy_v1L
cutoff_date: "2020-12-31"
domain: exoplanet_atmospheres

questions_file: submissions/citation_leader_L1/questions.jsonl
retrieval_file: data/retrieval/citation_leader_L_top8.jsonl
annotations_file: data/annotations/outcomes_citation_leader_L.jsonl
results_dir: results/citation_leader_L

past_corpus_manifest: data/corpus_metadata/corpus_a_large_manifest.json
future_corpus_manifest: data/corpus_metadata/corpus_b_large_manifest.json

judge_model: gpt-4.1

retrieval:
  model: text-embedding-3-small
  top_k: 8
  corpus_start: "2021-01-01"
  corpus_end: "2026-07-01"
