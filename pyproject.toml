[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-question-backtesting"
version = "1.0.0"
description = "An open protocol and pilot benchmark for historically evaluating AI-generated scientific questions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
live = ["requests>=2.31"]          # ADS collection, embeddings, LLM judging
dev = ["pytest>=7.4", "requests>=2.31"]

[project.urls]
Repository = "https://github.com/nonameisready/scientific-question-discovery-benchmark"
"Question Generation (Paper 1)" = "https://github.com/nonameisready/scientific-question-discovery"

[tool.setuptools]
packages = ["benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests", "paper3/tests"]
addopts = "-q"
