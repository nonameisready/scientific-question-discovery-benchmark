name: Data validation

# Guards the released benchmark data on every change:
# JSONL/schema conformance, unique question IDs, cutoff compliance,
# future-only retrieval documents, judge-citation containment, and
# metrics.json reproducibility.

on:
  push:
    branches: [main]
    paths: ["data/**", "results/**", "configs/**", "benchmark/**"]
  pull_request:
    paths: ["data/**", "results/**", "configs/**", "benchmark/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python scripts/validate_data.py --config configs/astronomy_2020.yaml
